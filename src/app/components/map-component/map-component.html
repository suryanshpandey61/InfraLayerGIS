
<div class="map-container">

  <div class="map-toolbar">
    <button
      type="button"
      class="toll-plaza-btn"
      [class.active]="tollPlazaEnabled"
      (click)="toggleTollPlaza()">

      {{ tollPlazaEnabled ? 'Hide Toll Plazas' : 'Show Toll Plazas' }}

    </button>
  </div>

  <div id="map"></div>

</div>
