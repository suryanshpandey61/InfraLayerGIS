
<div class="map-toolbar">
  <button
    type="button"
    class="toll-toggle-btn"
    [class.active]="tollPlazaEnabled"
    [disabled]="loadingTollPlazas"
    (click)="toggleTollPlazas()">

    <span class="status-dot"></span>

    {{ loadingTollPlazas
      ? 'Loading toll plazas...'
      : tollPlazaEnabled
        ? 'Hide Toll Plazas'
        : 'Show Toll Plazas' }}
  </button>
</div>

<div id="map"></div>
